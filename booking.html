<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Service | Biman Ranasinghe</title>

    <!-- SEO Meta Tags -->
    <meta name="description" content="Book video editing, design, and animation services. Quick and easy online booking.">
    <meta name="keywords" content="booking, video editing, design, service, appointment">

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="https://i.postimg.cc/jjY6ghZT/image.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        .booking-hero {
            padding: 130px 20px 60px;
            text-align: center;
            background: linear-gradient(180deg, rgba(204, 255, 0, 0.05) 0%, transparent 100%);
        }

        .booking-hero h1 {
            font-family: var(--font-head);
            font-size: 5rem;
            letter-spacing: 5px;
            color: #fff;
            margin-bottom: 10px;
        }

        .booking-hero h1 span {
            color: var(--accent-green);
        }

        .booking-hero p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .booking-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px 80px;
        }

        @media (max-width: 900px) {
            .booking-container {
                grid-template-columns: 1fr;
            }
            .booking-hero h1 {
                font-size: 3rem;
            }
        }

        .services-panel, .form-panel {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 30px;
        }

        .panel-title {
            font-size: 1.3rem;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .service-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 450px;
            overflow-y: auto;
        }

        .service-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px;
            background: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .service-card:hover, .service-card.selected {
            border-color: var(--accent-green);
            background: rgba(204, 255, 0, 0.05);
        }

        .service-details h4 {
            font-size: 0.95rem;
            margin-bottom: 4px;
        }

        .service-details p {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .service-cost {
            text-align: right;
        }

        .service-cost .price {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent-green);
        }

        .service-cost .time {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 14px;
            background: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: #fff;
            font-size: 0.95rem;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent-green);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .time-slots {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        @media (max-width: 500px) {
            .time-slots {
                grid-template-columns: repeat(2, 1fr);
            }
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        .time-slot {
            padding: 10px;
            background: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
        }

        .time-slot:hover, .time-slot.selected {
            background: var(--accent-green);
            color: var(--bg-main);
            border-color: var(--accent-green);
        }

        .selected-summary {
            background: rgba(204, 255, 0, 0.1);
            border: 1px solid var(--accent-green);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 25px;
            display: none;
        }

        .selected-summary.show {
            display: block;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: var(--accent-green);
            border: none;
            border-radius: 12px;
            color: var(--bg-main);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s;
        }

        .submit-btn:hover:not(:disabled) {
            background: #b3e600;
            transform: translateY(-2px);
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .result-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .result-modal.show {
            display: flex;
        }

        .result-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px;
            max-width: 420px;
            text-align: center;
        }

        .result-icon {
            font-size: 4rem;
            color: var(--accent-green);
            margin-bottom: 20px;
        }

        .result-content h2 {
            font-size: 1.6rem;
            margin-bottom: 15px;
        }

        .result-content p {
            color: var(--text-secondary);
            margin-bottom: 25px;
        }

        .result-details {
            background: var(--bg-main);
            padding: 20px;
            border-radius: 12px;
            text-align: left;
            margin-bottom: 25px;
            font-size: 0.9rem;
        }

        .result-details p {
            margin-bottom: 8px;
        }

        .result-details strong {
            color: var(--accent-green);
        }

        .done-btn {
            width: 100%;
            padding: 14px;
            background: var(--accent-green);
            border: none;
            border-radius: 10px;
            color: var(--bg-main);
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div id="nav-placeholder"></div>

    <section class="booking-hero">
        <h1>BOOK A <span>SERVICE</span></h1>
        <p>Select a service, choose your time, and book your appointment</p>
    </section>

    <div class="booking-container">
        <div class="services-panel">
            <h2 class="panel-title"><i class="fa-solid fa-briefcase"></i> Available Services</h2>
            <div class="service-list" id="service-list">
                <p style="color: var(--text-secondary);">Loading services...</p>
            </div>
        </div>

        <div class="form-panel">
            <h2 class="panel-title"><i class="fa-solid fa-calendar-day"></i> Book Appointment</h2>

            <div class="selected-summary" id="selected-summary">
                <h4 id="summary-service"></h4>
                <p id="summary-desc"></p>
                <div style="color: var(--accent-green); font-weight: 700;" id="summary-price"></div>
            </div>

            <form id="booking-form">
                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text" id="input-name" required placeholder="Your full name">
                </div>
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" id="input-email" required placeholder="Your email">
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="tel" id="input-phone" placeholder="Your phone number">
                </div>
                <div class="form-group">
                    <label>Select Date *</label>
                    <input type="date" id="input-date" required>
                </div>
                <div class="form-group">
                    <label>Available Times</label>
                    <div class="time-slots" id="time-slots">
                        <p style="grid-column:1/-1; color:var(--text-secondary);">Select a date first</p>
                    </div>
                </div>
                <div class="form-group">
                    <label>Project Details</label>
                    <textarea id="input-notes" rows="3" placeholder="Describe your project..."></textarea>
                </div>
                <button type="submit" class="submit-btn" id="submit-btn" disabled>
                    <i class="fa-solid fa-check"></i> Confirm Booking
                </button>
            </form>
        </div>
    </div>

    <div class="result-modal" id="result-modal">
        <div class="result-content">
            <div class="result-icon"><i class="fa-solid fa-circle-check"></i></div>
            <h2>Booking Confirmed!</h2>
            <p>Your appointment has been scheduled.</p>
            <div class="result-details" id="result-details"></div>
            <button class="done-btn" onclick="closeModal()">Done</button>
        </div>
    </div>

    <script>
        let services = [], selectedSvc = null, selectedTime = null;

        document.getElementById('input-date').min = new Date().toISOString().split('T')[0];

        document.addEventListener('DOMContentLoaded', loadServices);
        document.getElementById('input-date').addEventListener('change', loadSlots);
        document.getElementById('input-name').addEventListener('input', checkReady);
        document.getElementById('input-email').addEventListener('input', checkReady);

        async function loadServices() {
            try {
                const res = await fetch('nova_backend/booking.php?action=get_services');
                const data = await res.json();
                if (data.success) {
                    services = data.services;
                    document.getElementById('service-list').innerHTML = services.map(svc => `
                        <div class="service-card" onclick="pickService(${svc.id}, this)">
                            <div class="service-details">
                                <h4>${svc.name}</h4>
                                <p>${svc.description}</p>
                            </div>
                            <div class="service-cost">
                                <div class="price">$${svc.price}</div>
                                <div class="time">${svc.duration} min</div>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (e) {
                document.getElementById('service-list').innerHTML = '<p>Error loading services</p>';
            }
        }

        function pickService(id, el) {
            selectedSvc = services.find(s => s.id === id);
            document.querySelectorAll('.service-card').forEach(c => c.classList.remove('selected'));
            el.classList.add('selected');
            document.getElementById('selected-summary').classList.add('show');
            document.getElementById('summary-service').textContent = selectedSvc.name;
            document.getElementById('summary-desc').textContent = selectedSvc.description;
            document.getElementById('summary-price').textContent = `$${selectedSvc.price} (${selectedSvc.duration} min)`;
            checkReady();
        }

        async function loadSlots() {
            const date = document.getElementById('input-date').value;
            if (!date || !selectedSvc) return;
            try {
                const res = await fetch(`nova_backend/booking.php?action=get_slots&date=${date}&service_id=${selectedSvc.id}`);
                const data = await res.json();
                if (data.success) {
                    const container = document.getElementById('time-slots');
                    if (data.slots.length === 0) {
                        container.innerHTML = '<p style="grid-column:1/-1;color:var(--text-secondary)">No slots available</p>';
                    } else {
                        container.innerHTML = data.slots.map(slot => `
                            <div class="time-slot" onclick="pickTime('${slot.time}', this)">${slot.display}</div>
                        `).join('');
                    }
                }
            } catch (e) { console.error(e); }
        }

        function pickTime(time, el) {
            selectedTime = time;
            document.querySelectorAll('.time-slot').forEach(t => t.classList.remove('selected'));
            el.classList.add('selected');
            checkReady();
        }

        function checkReady() {
            const name = document.getElementById('input-name').value;
            const email = document.getElementById('input-email').value;
            const date = document.getElementById('input-date').value;
            document.getElementById('submit-btn').disabled = !(selectedSvc && name && email && date && selectedTime);
        }

        document.getElementById('booking-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';

            try {
                const res = await fetch('nova_backend/booking.php?action=book', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        service_id: selectedSvc.id,
                        name: document.getElementById('input-name').value,
                        email: document.getElementById('input-email').value,
                        phone: document.getElementById('input-phone').value,
                        date: document.getElementById('input-date').value,
                        time: selectedTime,
                        notes: document.getElementById('input-notes').value
                    })
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('result-details').innerHTML = `
                        <p><strong>Service:</strong> ${data.service}</p>
                        <p><strong>Date:</strong> ${data.date}</p>
                        <p><strong>Time:</strong> ${data.time}</p>
                        <p><strong>Amount:</strong> $${data.price}</p>
                    `;
                    document.getElementById('result-modal').classList.add('show');
                } else {
                    alert('Booking failed: ' + data.message);
                }
            } catch (e) {
                alert('Error submitting booking');
            }
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-check"></i> Confirm Booking';
        });

        function closeModal() {
            document.getElementById('result-modal').classList.remove('show');
            document.getElementById('booking-form').reset();
            selectedSvc = null;
            selectedTime = null;
            document.querySelectorAll('.service-card').forEach(c => c.classList.remove('selected'));
            document.getElementById('selected-summary').classList.remove('show');
            document.getElementById('time-slots').innerHTML = '<p style="grid-column:1/-1;color:var(--text-secondary)">Select a date first</p>';
        }
    </script>
    <script src="script.js"></script>
</body>

</html>
