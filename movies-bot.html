<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Primary Meta Tags -->
    <title>Movies Bot | Biman Ranasinghe</title>
    <meta name="title" content="Movies Bot | Biman Ranasinghe">
    <meta name="description" content="Access the ultimate Movies Bot for WhatsApp and more. Part of Biman Ranasinghe's creator ecosystem.">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="https://i.postimg.cc/jjY6ghZT/image.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        .movies-page-section {
            min-height: 100vh;
            padding: 120px 20px 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .movies-bot-container-large {
            width: 100%;
            max-width: 1200px;
            height: 80vh;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 10;
        }

        .movies-bot-container-large iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .page-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .page-header h1 {
            font-family: var(--font-head);
            font-size: 3.5rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
            color: #fff;
        }

        .back-home {
            position: fixed;
            top: 30px;
            left: 30px;
            z-index: 1000;
            padding: 12px 25px;
            border-radius: 30px;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .back-home:hover {
            background: var(--accent-blue);
            transform: translateX(-5px);
        }

        @media (max-width: 768px) {
            .page-header h1 {
                font-size: 2.5rem;
            }
            .movies-bot-container-large {
                height: 70vh;
            }
            .back-home {
                top: 20px;
                left: 20px;
                padding: 10px 20px;
            }
        }
    </style>
</head>

<body class="antialiased">
    <!-- Video Background -->
    <div class="video-background">
        <div class="video-foreground">
            <iframe id="streamable-player"
                src="https://streamable.com/e/xapxv4?autoplay=1&muted=1&controls=0&nocontrol=1&loop=1" frameborder="0"
                allow="autoplay; fullscreen">
            </iframe>
        </div>
        <div class="overlay"></div>
    </div>

    <!-- Global Liquid Glass Background -->
    <div class="liquid-glass-bg">
        <div class="glass-blobs">
            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>
            <div class="blob blob-3"></div>
            <div class="blob blob-4"></div>
        </div>
        <div class="glass-noise"></div>
    </div>

    <a href="index.html" class="back-home liquid-glass">
        <i class="fa-solid fa-arrow-left"></i> BACK TO HOME
    </a>

    <main>
        <section class="movies-page-section">
            <div class="page-header" data-aos="fade-down">
                <h1>MOVIES <span class="badge">BOT</span></h1>
                <p style="color: var(--text-secondary); letter-spacing: 1px;">THE ULTIMATE ENTERTAINMENT HUB</p>
            </div>

            <div class="movies-bot-container-large liquid-glass" data-aos="zoom-in">
                <iframe src="https://asitha.top/whatsapp-movie" frameborder="0" loading="lazy"
                    allow="autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
            </div>
        </section>
    </main>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 1000, once: true });
    </script>
    <script src="page-transition.js"></script>
</body>

</html>
